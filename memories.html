<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#0b0b0b;
    margin:0;
    font-family:Poppins;
}

.header{
    text-align:center;
    padding:40px;
    color:white;
}

.gallery{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

    gap:15px;

    padding:20px;
}

.gallery img{

    width:100%;
    height:250px;

    object-fit:cover;

    border-radius:20px;

    transition:0.4s;
}

.gallery img:hover{

    transform:scale(1.05);

}

.header h1{
    font-size:4rem;
    color:#ffb3d1;
}

.header p{
    margin-top:10px;
    color:#ddd;
}

.timeline{
    width:90%;
    max-width:1000px;
    margin:60px auto;
}

.memory{
    display:flex;
    align-items:center;
    gap:30px;
    margin-bottom:60px;
    background:rgba(255,255,255,0.05);
    border-radius:25px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
}

.memory img{
    width:300px;
    height:300px;
    object-fit:cover;
}

.memory-content{
    padding:20px;
}

.memory-content h2{
    color:#ff8fb8;
    margin-bottom:15px;
}

.memory-content p{
    line-height:1.8;
    color:#ddd;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#ff0066;
    color:white;
    text-decoration:none;
    border-radius:30px;
}

.back-home{

    display:flex;
    justify-content:center;
    align-items:center;

    padding:50px 0;
}

.home-btn{

    padding:15px 35px;

    border:none;
    border-radius:50px;

    background:linear-gradient(135deg,#ff4d88,#ff0066);

    color:white;

    font-size:1rem;

    cursor:pointer;

    transition:0.4s;

    box-shadow:0 8px 25px rgba(255,0,100,0.4);
}

.home-btn:hover{

    transform:scale(1.05);

    box-shadow:0 12px 30px rgba(255,0,100,0.6);

}

@media(max-width:768px){

.memory{
    flex-direction:column;
}

.memory img{
    width:100%;
}

.header h1{
    font-size:2.5rem;
}

}

.back-home{

    display:flex;
    justify-content:center;
    align-items:center;

    padding:50px 0;
}

.home-btn{

    padding:15px 35px;

    border:none;
    border-radius:50px;

    background:linear-gradient(135deg,#ff4d88,#ff0066);

    color:white;

    font-size:1rem;

    cursor:pointer;

    transition:0.4s;

    box-shadow:0 8px 25px rgba(255,0,100,0.4);
}

.home-btn:hover{

    transform:scale(1.05);

    box-shadow:0 12px 30px rgba(255,0,100,0.6);

}

</style>
</head>
<body>

<div class="header">
    <h1>Our Memories ❤️</h1>
</div>

<div class="gallery" id="gallery"></div>

<div class="back-home">

    <a href="index.html">
        <button class="home-btn">
            Back To Home ❤️
        </button>
    </a>

</div>

<audio id="bgMusic" loop>
    <source src="sanasa.mp3" type="audio/mp3">
  </audio>

<script>

const gallery = document.getElementById("gallery");

// TOTAL IMAGES
const totalImages = 1000;

// AUTO LOAD
for(let i = 1; i <= totalImages; i++) {

    const img = document.createElement("img");

    img.src = `images/${i}.jpeg`;

    gallery.appendChild(img);
}

</script>

<script>
const music = document.getElementById("bgMusic");

function startMusic() {
    music.play();

    document.removeEventListener("click", startMusic);
    document.removeEventListener("touchstart", startMusic);
}

document.addEventListener("click", startMusic);
document.addEventListener("touchstart", startMusic);
</script>




</body>

</html>
